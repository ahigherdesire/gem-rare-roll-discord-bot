# Fly.io config. `fly launch` will set/replace the app name; keep the rest.
app = "gem-rare-roll-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep exactly one machine running at all times — this is a poller, not a
  # request-driven web app, so it must never be scaled to zero / suspended.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
